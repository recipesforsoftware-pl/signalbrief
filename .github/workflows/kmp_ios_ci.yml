name: KMP and iOS CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gradle/**'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'shared/**'
      - 'shared-ui/**'
      - 'iosApp/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'gradle/**'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'shared/**'
      - 'shared-ui/**'
      - 'iosApp/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kmp-ios:
    name: Shared, framework, and unsigned iOS simulator build
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run shared module tests
        run: ./gradlew :shared:allTests

      - name: Run shared UI tests
        run: ./gradlew :shared-ui:allTests

      - name: Link iOS simulator framework
        run: ./gradlew :shared-ui:linkDebugFrameworkIosSimulatorArm64

      - name: Check Kotlin formatting
        run: ./gradlew ktlintCheck

      - name: Run static analysis
        run: ./gradlew detekt

      - name: Create local CI Secrets.xcconfig with a fake key
        run: |
          printf 'NEWS_API_KEY = CI_FAKE_NEWS_API_KEY_DO_NOT_USE\n' > iosApp/Configuration/Secrets.xcconfig

      - name: Build iOS host app (unsigned simulator build)
        run: |
          mkdir -p iosApp/build
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build 2>&1 | tee iosApp/build/xcodebuild.log

      - name: Upload shared test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload shared UI test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shared-ui-test-reports
          path: shared-ui/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload ktlint and detekt reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-detekt-reports
          path: |
            shared/build/reports/ktlint/
            shared/build/reports/detekt/
            shared-ui/build/reports/ktlint/
            shared-ui/build/reports/detekt/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Xcode build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-diagnostics
          path: iosApp/build/xcodebuild.log
          retention-days: 7
          if-no-files-found: warn
