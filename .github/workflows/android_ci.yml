name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: 'true'

      - name: Check formatting
        run: ./gradlew ktlintCheck

      - name: Run static analysis
        run: ./gradlew detekt

      - name: Run unit tests
        run: ./gradlew test

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Generate coverage reports
        run: ./gradlew :app:koverHtmlReportAll :app:koverXmlReportAll

      - name: Verify coverage
        run: ./gradlew :app:koverVerifyAll

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: app/build/reports/ktlint/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: app/build/reports/detekt/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Kover reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-reports
          path: app/build/reports/kover/
          retention-days: 7
          if-no-files-found: warn
