name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gradle/**'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'core/**'
      - 'shared-ui/**'
      - 'webApp/**'
      - 'kotlin-js-store/**'
      - '.github/workflows/web_ci.yml'
  push:
    branches:
      - main
    paths:
      - 'gradle/**'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'core/**'
      - 'shared-ui/**'
      - 'webApp/**'
      - 'kotlin-js-store/**'
      - '.github/workflows/web_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build Wasm browser distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Binaryen 131
        run: |
          BINARYEN_VERSION=131
          BINARYEN_SHA256=b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db
          ARCHIVE="$RUNNER_TEMP/binaryen.tar.gz"
          DEST="$RUNNER_TEMP/binaryen"

          curl --fail --location --retry 3 \
            --output "$ARCHIVE" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"

          echo "${BINARYEN_SHA256}  ${ARCHIVE}" | sha256sum --check

          mkdir -p "$DEST"
          tar -xzf "$ARCHIVE" -C "$DEST" --strip-components=1

          echo "$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/wasm-opt" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build production Web distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution
